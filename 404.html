<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable, Ideal'Optic</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#DD2B27">
<link rel="icon" type="image/png" sizes="64x64" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Archivo:wght@400;700&display=swap">
<style>
:root{--red:#DD2B27;--ink:#111;--ink-2:#444;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;font-family:Archivo,system-ui,sans-serif;color:var(--ink);background:var(--paper);text-align:center;padding:24px}
main{max-width:560px}
img{width:56px;height:56px;object-fit:contain;margin-bottom:18px}
.k{font-size:.7rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--red);margin:0 0 10px}
h1{font-family:"Bodoni Moda",serif;font-weight:400;font-size:clamp(2rem,6vw,3.4rem);line-height:1.02;margin:0 0 14px}
p{color:var(--ink-2);margin:0 0 26px;line-height:1.6}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;font-weight:700;font-size:.9rem;text-decoration:none;border:1px solid transparent;margin:4px}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-ghost{background:transparent;color:var(--ink);border-color:#ddd}
</style>
</head>
<body>
<main>
  <img src="/img/logo.png" alt="">
  <p class="k">Erreur 404</p>
  <h1>Cette page n'existe pas.</h1>
  <p>L'adresse a peut-être changé. Retrouvez nos cinq boutiques, nos expertises et la prise de rendez-vous sur la page d'accueil.</p>
  <a class="btn btn-red" href="/">Retour à l'accueil</a>
  <a class="btn btn-ghost" href="/#rdv">Prendre rendez-vous</a>
</main>
</body>
</html>
